<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calm — offline</title>
<style>
  :root { --bg: #f6f4ef; --surface: #fffdf9; --ink: #23302c; --ink-2: #5a6662; --accent: #3f7d6e; --accent-ink: #fff; --line: #e2ddd2; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111716; --surface: #182120; --ink: #e8edeb; --ink-2: #b0bcb8; --accent: #7cc3b0; --accent-ink: #0d1513; --line: #2a3533; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; } p { color: var(--ink-2); line-height: 1.55; }
  button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .crisis { font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>Calm needs a connection to show your check-ins, because your data is kept on the server and isn't stored on this device.</p>
  <p><button type="button" onclick="location.reload()">Try again</button></p>
  <p class="crisis">If you need help right now, call your local emergency number. Free, confidential helplines in 130+ countries are listed at findahelpline.com.</p>
</main>
</body>
</html>
